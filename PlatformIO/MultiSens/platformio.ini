; Separate project: original Arduino sources remain in Devices/.
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
; Match Arduino NodeMCU default: 4 MB flash, 2 MB filesystem.
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    symlink://../shared/ArduinoJson
    symlink://../shared/SocketIoClient
    symlink://../shared/WebSockets
    symlink://../shared/SmartSnap

    adafruit/Adafruit VEML7700 Library@2.1.6
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit BMP280 Library@3.0.0
