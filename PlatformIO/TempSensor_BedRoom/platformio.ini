; Separate project: original Arduino sources remain in Devices/.
[env:esp01s]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
; ESP-01S: 1 MB flash, 64 KB filesystem.
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m64.ld
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    symlink://../shared/ArduinoJson
    symlink://../shared/SocketIoClient
    symlink://../shared/WebSockets
    symlink://../shared/SmartSnap
    symlink://../shared/DHT_sensor_library_for_ESPx
